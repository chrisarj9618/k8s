apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}"
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.Port }}
    targetPort: {{ .Values.service.Port }}
    protocol: TCP
  selector:
    app: nginx